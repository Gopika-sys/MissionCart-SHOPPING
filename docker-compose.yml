services:
  mysql:
    image: mysql:8.4
    container_name: missioncart-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-missioncart}
      MYSQL_USER: ${MYSQL_USER:-missioncart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-missioncart_dev_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-missioncart_root_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - missioncart_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-missioncart_root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: missioncart-redis
    restart: unless-stopped
    profiles: ["cache"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  missioncart_mysql_data:
